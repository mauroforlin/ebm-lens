name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project (dev extras)
        run: pip install -e ".[dev]"

      - name: Lint
        run: ruff check .

      - name: Test (offline only)
        run: pytest -m "not live"
