[project]
name = "ebm-lens"
version = "0.1.0"
description = "Evidence discovery for medical and clinical topics: searches twelve public biomedical databases, expands through the citation graph, then ranks and synthesises the results."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "fastapi==0.110.2",
    "uvicorn[standard]==0.30.1",
    "pydantic-settings==2.4.0",
    "python-dotenv==1.0.1",
    "openai>=2.8.1",
    "tenacity==8.3.0",
    "httpx==0.27.0",
    "numpy>=1.26.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # long lines are prompt text, not code
    "B008",   # FastAPI Depends()/Header() in defaults is the framework idiom
]

[tool.ruff.lint.per-file-ignores]
"app/pipeline/searcher.py" = ["A004"]  # shadows builtin TimeoutError deliberately
"app/pipeline/orchestrator.py" = ["A004"]  # shadows builtin TimeoutError deliberately
"app/pipeline/agentic.py" = ["A004"]  # shadows builtin TimeoutError deliberately

[tool.pytest.ini_options]
testpaths = ["tests"]
